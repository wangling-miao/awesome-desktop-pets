name: Validate Pets

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate and build index
        run: npm run build

      - name: Upload generated gallery artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-gallery
          path: public

